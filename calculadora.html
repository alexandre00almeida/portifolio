        ☰ Menu

<main class="centralizado">
    <section id="calculadora-app">
        <h2>Calculadora Web</h2>

        <div class="caixa-calculadora">
            <div class="campo-form">
                <label for="num1">Primeiro Número:</label>
                <input type="number" id="num1" placeholder="Ex: 10" step="any">
            </div>
            <div class="campo-form">
                <label for="operacao">Operação:</label>
                <select id="operacao">
                    <option value="+">Somar (+)</option>
                    <option value="-">Subtrair (-)</option>
                    <option value="*">Multiplicar (*)</option>
                    <option value="/">Dividir (/)</option>
                </select>
            </div>
            <div class="campo-form">
                <label for="num2">Segundo Número:</label>
                <input type="number" id="num2" placeholder="Ex: 5" step="any">
            </div>
            <button type="button" id="btn-calcular" style="width:100%; margin-top:8px;">Calcular</button>
            <div id="resultado-calculadora"></div>
        </div>
    </section>
</main>
